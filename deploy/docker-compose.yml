# docker compose -f deploy/docker-compose.yml up -d --build
#
# Run from the repository root. Every setting comes from the environment, so
# one file covers a laptop and a server: copy .env.example to deploy/.env and
# edit that, never this file.
#
# The API listens on localhost only. Put something in front of it — a reverse
# proxy for TLS, or a Cloudflare Tunnel, which needs no open port at all.

x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime
  image: osu-mapmatcher-api:latest
  # uid:gid used inside the container. With a bind mount, this has to be the
  # owner of the host folder, otherwise the setup jobs cannot write the index.
  user: "${OSUMAPMATCHER_UID:-10001}:${OSUMAPMATCHER_GID:-10001}"
  volumes:
    # a path (bind mount) or the named volume below — both work here
    - ${OSUMAPMATCHER_HOST_DATA:-osu-mapmatcher-index}:/data

services:
  api:
    <<: *common
    container_name: ${OSUMAPMATCHER_CONTAINER:-osu-mapmatcher-api}
    restart: unless-stopped
    ports:
      - "${OSUMAPMATCHER_BIND:-127.0.0.1:8080}:8080"
    environment:
      # variantes servies ; chacune pese ~290 Mo
      OSUMAPMATCHER_API_VARIANTS: "${OSUMAPMATCHER_API_VARIANTS:-nomod}"
      # une API publique en lecture seule : "*" convient. Restreindre a son
      # propre domaine si elle ne doit servir qu'un site.
      OSUMAPMATCHER_API_CORS: "${OSUMAPMATCHER_API_CORS:-*}"
      OSUMAPMATCHER_API_RATE: "${OSUMAPMATCHER_API_RATE:-120}"
      OSUMAPMATCHER_API_BURST: "${OSUMAPMATCHER_API_BURST:-60}"
      OSUMAPMATCHER_API_FILE_COST: "${OSUMAPMATCHER_API_FILE_COST:-5}"
      OSUMAPMATCHER_API_MAX_UPLOAD: "${OSUMAPMATCHER_API_MAX_UPLOAD:-4000000}"
      # indispensable derriere un proxy ou un tunnel : sinon tous les clients
      # partagent le seau a jetons d'une seule IP
      OSUMAPMATCHER_API_TRUST_PROXY: "${OSUMAPMATCHER_API_TRUST_PROXY:-1}"
      OSUMAPMATCHER_API_TOKEN: "${OSUMAPMATCHER_API_TOKEN:-}"
      OSUMAPMATCHER_API_DOCS: "${OSUMAPMATCHER_API_DOCS:-1}"
    command:
      - python
      - -m
      - osumapmatcher.api
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --workers
      - "${OSUMAPMATCHER_WORKERS:-1}"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # --- outils ponctuels, jamais demarres par `up` ----------------------------

  # docker compose --profile setup run --rm fetch
  fetch:
    <<: *common
    profiles: ["setup"]
    environment:
      OSUMAPMATCHER_API_VARIANTS: "${OSUMAPMATCHER_API_VARIANTS:-nomod}"
      OSUMAPMATCHER_INDEX_URL: "${OSUMAPMATCHER_INDEX_URL:-}"
    entrypoint:
      - python
      - -c
      - |
        import os, sys
        from osumapmatcher.launcher import ensure_index
        wanted = os.environ.get("OSUMAPMATCHER_API_VARIANTS", "nomod").split(",")
        sys.exit(0 if ensure_index([v.strip() for v in wanted if v.strip()]) else 1)

  # docker compose --profile setup run --rm builder \
  #   python scripts/build_index.py --corpus /data/corpus/DT --out /data/index/DT
  builder:
    <<: *common
    profiles: ["setup"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: builder
    image: osu-mapmatcher-builder:latest

volumes:
  osu-mapmatcher-index:
