# Extrait a poser dans /etc/nginx/sites-available/. Les certificats se font
# avec certbot ; ce fichier ne montre que ce qui est specifique a l'API.

server {
    listen 443 ssl http2;
    server_name api.exemple.com;

    ssl_certificate     /etc/letsencrypt/live/api.exemple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.exemple.com/privkey.pem;

    # l'API refuse au-dela de 4 Mo ; nginx doit refuser avant, pas apres avoir
    # tout tamponne sur disque
    client_max_body_size 4m;

    gzip on;
    gzip_types application/json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # sans ca, OSUMAPMATCHER_API_TRUST_PROXY=1 ne sert a rien et tous les clients
        # partagent le seau a jetons de l'IP du proxy
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
}
